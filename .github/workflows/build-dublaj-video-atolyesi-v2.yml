name: Build Dublaj Video Atolyesi v2 APK

on:
  push:
    branches: ["build/dublaj-video-atolyesi-v2"]
    paths:
      - ".github/workflows/build-dublaj-video-atolyesi-v2.yml"
      - ".apkbuild-v2/**"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/build-dublaj-video-atolyesi-v2.yml"
      - ".apkbuild-v2/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore source project
        run: |
          set -euo pipefail
          mkdir -p /tmp/dublaj-build
          cat .apkbuild-v2/part* > /tmp/dublaj-build/source.b64
          base64 -d /tmp/dublaj-build/source.b64 > /tmp/dublaj-build/source.zip
          unzip -tq /tmp/dublaj-build/source.zip
          unzip -q /tmp/dublaj-build/source.zip -d /tmp/dublaj-build

      - name: Build APK
        working-directory: /tmp/dublaj-build/AkilliSesBolucuAndroid
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify Android package
        run: |
          set -euo pipefail
          APK=/tmp/dublaj-build/AkilliSesBolucuAndroid/app/build/outputs/apk/debug/app-debug.apk
          {
            echo "Dublaj Video Atolyesi v2.0.0 - APK doğrulama raporu"
            echo
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
            echo
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK"
          } | tee /tmp/apk-verification.txt

      - name: Prepare artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/artifact
          cp /tmp/dublaj-build/AkilliSesBolucuAndroid/app/build/outputs/apk/debug/app-debug.apk /tmp/artifact/DublajVideoAtolyesi-v2.0.0.apk
          cp /tmp/apk-verification.txt /tmp/artifact/DublajVideoAtolyesi-v2.0.0-DOGRULAMA.txt
          cd /tmp/artifact
          sha256sum DublajVideoAtolyesi-v2.0.0.apk > DublajVideoAtolyesi-v2.0.0-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: DublajVideoAtolyesi-v2.0.0
          path: /tmp/artifact/*
          if-no-files-found: error
