name: Build Dublaj Video Atolyesi v2.0.1 APK

on:
  push:
    branches: ["build/dublaj-video-atolyesi-v201"]
    paths:
      - ".github/workflows/build-dublaj-video-atolyesi-v201.yml"
      - ".apkbuild-v201/download-storage.patch"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/build-dublaj-video-atolyesi-v201.yml"
      - ".apkbuild-v201/download-storage.patch"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore verified v2 source project
        run: |
          set -euo pipefail
          git fetch origin refs/heads/build/dublaj-video-atolyesi-v2:refs/remotes/origin/build/dublaj-video-atolyesi-v2 --depth=1
          mkdir -p /tmp/dublaj-build
          for part in 000 001 002 003; do
            git show "refs/remotes/origin/build/dublaj-video-atolyesi-v2:.apkbuild-v2/part${part}"
          done > /tmp/dublaj-build/source.b64
          base64 -d /tmp/dublaj-build/source.b64 > /tmp/dublaj-build/source.zip
          unzip -tq /tmp/dublaj-build/source.zip
          unzip -q /tmp/dublaj-build/source.zip -d /tmp/dublaj-build
      - name: Apply Downloads storage patch
        working-directory: /tmp/dublaj-build/AkilliSesBolucuAndroid
        run: |
          set -euo pipefail
          patch -p1 --forward < "$GITHUB_WORKSPACE/.apkbuild-v201/download-storage.patch"
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android"\n    xmlns:tools="http://schemas.android.com/tools">'
          )
          text = text.replace(
              '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />',
              '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" tools:replace="android:maxSdkVersion" />'
          )
          path.write_text(text, encoding="utf-8")
          PY
          grep -q 'versionName '\''2.0.1'\''' app/build.gradle
          grep -q 'MANAGE_EXTERNAL_STORAGE' app/src/main/AndroidManifest.xml
          grep -q 'tools:replace="android:maxSdkVersion"' app/src/main/AndroidManifest.xml
          grep -q 'DublajVideoProjeleri' app/src/main/java/com/odium/akillisesbolucu/AppFiles.java
      - name: Build APK
        working-directory: /tmp/dublaj-build/AkilliSesBolucuAndroid
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify Android package
        run: |
          set -euo pipefail
          APK=/tmp/dublaj-build/AkilliSesBolucuAndroid/app/build/outputs/apk/debug/app-debug.apk
          {
            echo "Dublaj Video Atolyesi v2.0.1 - APK doğrulama raporu"
            echo
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
            echo
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK"
            echo
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump permissions "$APK"
          } | tee /tmp/apk-verification.txt
      - name: Prepare artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/artifact
          cp /tmp/dublaj-build/AkilliSesBolucuAndroid/app/build/outputs/apk/debug/app-debug.apk /tmp/artifact/DublajVideoAtolyesi-v2.0.1.apk
          cp /tmp/apk-verification.txt /tmp/artifact/DublajVideoAtolyesi-v2.0.1-DOGRULAMA.txt
          cd /tmp/artifact
          sha256sum DublajVideoAtolyesi-v2.0.1.apk > DublajVideoAtolyesi-v2.0.1-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DublajVideoAtolyesi-v2.0.1
          path: /tmp/artifact/*
          if-no-files-found: error
